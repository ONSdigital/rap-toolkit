pipeline_variables:
  name: "Config Example Pipeline"
  backend: python
  stages:
    - 0_clean_data:
        name: "0_clean_data"
        location: examples/pipeline_2/scripts/0_clean_data.py
        dependencies: []
    - 1_derive_vars:
        location: examples/pipeline_2/scripts/1_derive_vars.py
        dependencies:
          - "0_clean_data"
    - 2_reporting:
        location: examples/pipeline_2/scripts/2_reporting.py
        dependencies:
          - "1_derive_vars"
  working_dir: examples/pipeline_2
  project_root: examples/pipeline_2
  data_dir: examples/pipeline_2/data
  output_dir: examples/pipeline_2/runs
  log_dir: examples/pipeline_2/logs
  overwrite: True
  metadata:
    example: retail-orders-using-configuration
    description: "This is an example of a pipeline that uses configuration files to run a retail orders pipeline."
  stages_to_run:
    0_clean_data: True
    1_derive_vars: True
    2_reporting: True
  
    
global_variables:
  year_of_run: 2020

stage_configuration:
  0_clean_data:
    expected_variables: 
      - "order_id"
      - "customer_name"
      - "region"
      - "product"
      - "quantity"
      - "unit_price"
      - "order_date"
      - "order_method"
    identifiable_cols:
      - "customer_name"
      - "age"
      - "dob"
      - "address"
  1_derive_vars:
    delivery_times:
      north: 14
      south: 4
      east: 7
      west: 7
    order_date: "Order_date"
    estimated_delivery_date: "Estimated_delivery_date"
    delivery_day: "Delivery_day"
    region: "Region"
    total_cost: "Total_cost"
    quantity: "Quantity"
    unit_price: "Unit_price"
    order_day: "Order_day"
    order_month: "Order_month"
    large_order: "Large_order"
    small_order: "Small_order"
    postage: "Postage"
    postage_values:
      large_order: 5.00
      small_order: 1.00
      default: 2.50
    product: "Product"
    product_costs:
      notebook: 1.00
      pen: 0.3
      folder: 0.75
    total_production_cost: "Total_production_cost"
    order_profit: "Order_profit"
  2_reporting:
    region: "Region"
    order_profit: "Order_profit"
    quantity: "Quantity"
    order_day: "Order_day"
    large_order: "Large_order"
    small_order: "Small_order"
    order_id: "Order_id"
    product: "Product"
    num_format: "{:.2f}"
