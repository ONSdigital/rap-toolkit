name: Release

# TEMPORARILY DISABLED - Re-enable by uncommenting the 'on:' section below
# on:
#   push:
#     tags: ["v*.*.*"]  # On any Semver tag, e.g. v1.2.3 but must point to an ancestor of main
#   release:
#     types:
#       - published

jobs:
  build:
    name: Validate Publication Tag, Build Package and Upload Artifacts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Validate semver tag
      run: |
        [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
          || { echo "::error::Tag must match vMAJOR.MINOR.PATCH"; exit 1; }
    - name: Verify tag is on main
      run: |
        git fetch origin main --depth=1
        git merge-base --is-ancestor ${{ github.sha }} origin/main \
          || { echo "::error::Release tags must point to a commit on main"; exit 1; }
    - name: Set up Python 3.10
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.10"
        cache: pip
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
    - name: Build package
      run: |
        python -m build --sdist --wheel
    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: distributions
        path: dist/
        if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    
    if: startsWith(github.ref, 'refs/tags/v') # Only run on version tags
    needs: build
    runs-on: ubuntu-latest
    
    environment: 
      name: testpypi
      url: https://test.pypi.org/project/${{ github.repository }}/
    
    permissions:
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: distributions
        path: dist/
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # Requires manual approval — configure the 'pypi' environment in GH repo settings.
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
