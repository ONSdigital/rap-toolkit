[metadata]
name = rap-toolkit
description = A simple Pipeline orchestration package.
version = 0.1.1
author = ONSDigital
platforms = win32
classifiers =
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
packages = find:
python_requires = >=3.10
zip_safe = no
install_requires =
    pyyaml
    boto3
    botocore

[options.packages.find]
include =
    rap_toolkit*

[options.package_data]
rap_toolkit =
    py.typed

[options.extras_require]
dev =
    bandit[toml]
    boto3-stubs
    coverage
    pytest-cov
    detect-secrets==1.0.3
    botocore-stubs
    mypy
    myst-parser
    moto
    pre-commit
    pytest
    python-dotenv
    ruff
    Sphinx
    toml
    types-PyYAML
    pandas